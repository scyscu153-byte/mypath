<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이패스 — 목표에 나를 맞추는 교내 프로그램 추천</title>
<meta name="description" content="목표 기업이 요구하는 역량과 내 현재 상태의 갭을, 학교 곳곳에 흩어진 교내 프로그램으로 메워주는 도구">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink:   { 900: '#0d1117', 800: '#161b22', 700: '#21262d', 600: '#30363d' },
          brand: { 500: '#3b82f6', 400: '#60a5fa' },
        },
      },
    },
  };
</script>
<style>
  body { word-break: keep-all; }
  /* 화면 전환 — .screen 중 [data-active] 만 보인다 */
  .screen { display: none; }
  .screen[data-active] { display: block; }
</style>
</head>

<body class="bg-ink-900 text-slate-100 min-h-screen">

<!-- ══════════════════════════════════════════════════════════
     헤더
     ══════════════════════════════════════════════════════════ -->
<header class="border-b border-ink-600">
  <div class="max-w-3xl mx-auto px-5 py-4 flex items-center justify-between">
    <div>
      <h1 class="text-lg font-bold">마이패스</h1>
      <p class="text-xs text-slate-400">목표에 나를 맞추는 교내 프로그램 추천</p>
    </div>
    <!-- 크레딧 잔량 — gateway.js 가 갱신 -->
    <div id="credit-badge" class="text-xs text-slate-400 tabular-nums"></div>
  </div>
</header>

<main class="max-w-3xl mx-auto px-5 py-8">

  <!-- ══════════════════════════════════════════════════════════
       화면 1 · 온보딩 — 기본정보 입력 (최초 1회)
       ══════════════════════════════════════════════════════════ -->
  <section id="screen-onboarding" class="screen" data-active>
    <div id="mount-onboarding"></div>
  </section>

  <!-- ══════════════════════════════════════════════════════════
       화면 2 · 목표 설정
       ══════════════════════════════════════════════════════════ -->
  <section id="screen-target" class="screen">
    <div id="mount-target"></div>
  </section>

  <!-- ══════════════════════════════════════════════════════════
       화면 3 · 분석 진행 — 단계별 표시
       검색이 5~35초 걸리므로 진행 상황을 반드시 보여준다
       ══════════════════════════════════════════════════════════ -->
  <section id="screen-progress" class="screen">
    <div id="mount-progress"></div>
  </section>

  <!-- ══════════════════════════════════════════════════════════
       화면 4 · 추천 리포트
       4개 패널이 동시에 차오르고, 의견이 갈리는 지점을 강조한다
       ══════════════════════════════════════════════════════════ -->
  <section id="screen-report" class="screen">
    <div id="mount-report"></div>
  </section>

  <!-- ══════════════════════════════════════════════════════════
       화면 5 · 마이 프로필 — 누적 기록, 여기서 새 목표로 순환
       ══════════════════════════════════════════════════════════ -->
  <section id="screen-profile" class="screen">
    <div id="mount-profile"></div>
  </section>

</main>

<!-- ══════════════════════════════════════════════════════════
     푸터 — 신뢰성 고지 (설계 원칙 1)
     ══════════════════════════════════════════════════════════ -->
<footer class="border-t border-ink-600 mt-16">
  <div class="max-w-3xl mx-auto px-5 py-6 text-xs text-slate-500 leading-relaxed">
    <p>
      이 도구는 <strong class="text-slate-400">프로그램의 참여 자격을 판정하지 않습니다.</strong>
      신청 자격·학년 제한·중복 참여 제한·마감일은 반드시 원문에서 확인하세요.
    </p>
    <p class="mt-1">
      출처가 확인되지 않은 항목은 표시하지 않습니다.
      검색 결과는 <code class="text-slate-400">mjc.ac.kr</code> 도메인으로 제한됩니다.
    </p>
    <p class="mt-3 text-slate-600">
      2026학년도 명지전문대학 RISE사업단 AI 해커톤 경진대회 · 팀 시너지
    </p>
  </div>
</footer>

<script type="module" src="./js/app.js"></script>
</body>
</html>
